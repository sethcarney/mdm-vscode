version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint's peer range is `>=4.8.4 <6.1.0`, so TS 7 breaks
      # `bun run lint` outright ("typescript-eslint does not support TS 7.0").
      # TS 7.0 ships no stable programmatic API — that lands in 7.1 — and
      # upstream tracks support in typescript-eslint#10940. Drop this ignore
      # once a typescript-eslint release accepts TS 7.
      - dependency-name: typescript
        versions:
          - ">= 7"
      # vsce refuses to package when @types/vscode is newer than
      # engines.vscode, so the two must move together. Bumping the types
      # alone silently breaks `bun run package`, and therefore the release
      # workflow, which is how it broke before. Raise engines.vscode first,
      # then widen this ignore to match.
      - dependency-name: "@types/vscode"
        versions:
          - "> 1.125"
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # All sub-paths must be pinned to the same SHA, so no update-types
      # filter here — majors have to move together too.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Noise reduction only; majors still get individual PRs.
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"
        update-types:
          - minor
          - patch
